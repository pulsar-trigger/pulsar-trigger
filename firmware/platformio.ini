[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DFW_VERSION_MAJOR=0
    -DFW_VERSION_MINOR=7
    -DFW_VERSION_PATCH=1

[env:native]
platform = native
test_framework = unity
build_flags =
    -Iinclude
    -Itest/stubs
    -DFW_VERSION_MAJOR=0
    -DFW_VERSION_MINOR=7
    -DFW_VERSION_PATCH=1
    -DDEFAULT_PIN_SHUTTER=25
    -DDEFAULT_PIN_FOCUS=26
    -DDEFAULT_FOCUS_MS=200
    -DDEBOUNCE_MS=50
    -DMIN_FOCUS_MS=50
    -DMAX_FOCUS_MS=5000
    -DMIN_INTERVAL_MS=500
    -DMAX_INTERVAL_MS=3600000
    -DMIN_EXPOSURE_MS=10
    -DMAX_EXPOSURE_MS=3600000
    -DMIN_SHOT_COUNT=0
    -DMAX_SHOT_COUNT=9999
    -DMIN_DELAY_MS=0
    -DMAX_DELAY_MS=3600000
