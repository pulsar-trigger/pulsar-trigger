[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
extra_scripts = pre:erase_otadata.py
lib_deps =
build_src_filter = +<*> -<display.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DFW_VERSION_MAJOR=0
    -DFW_VERSION_MINOR=23
    -DFW_VERSION_PATCH=0

[env:m5sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
extra_scripts = pre:erase_otadata.py
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
    M5PM1=https://github.com/m5stack/M5PM1
build_flags =
    -DBOARD_M5STICKS3
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DFW_VERSION_MAJOR=0
    -DFW_VERSION_MINOR=23
    -DFW_VERSION_PATCH=0

[env:m5core2]
platform = espressif32@6.12.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
extra_scripts = pre:erase_otadata.py
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
build_flags =
    -DBOARD_M5CORE2
    -DCORE_DEBUG_LEVEL=3
    -DFW_VERSION_MAJOR=0
    -DFW_VERSION_MINOR=23
    -DFW_VERSION_PATCH=0

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    -Iinclude
    -Itest/stubs
    -DFW_VERSION_MAJOR=0
    -DFW_VERSION_MINOR=23
    -DFW_VERSION_PATCH=0
    -DDEFAULT_PIN_SHUTTER=25
    -DDEFAULT_PIN_FOCUS=26
    -DDEFAULT_FOCUS_MS=200
    -DDEBOUNCE_MS=50
    -DMIN_FOCUS_MS=50
    -DMAX_FOCUS_MS=5000
    -DMIN_INTERVAL_MS=500
    -DMAX_INTERVAL_MS=3600000
    -DMIN_EXPOSURE_MS=10
    -DMAX_EXPOSURE_MS=3600000
    -DMIN_SHOT_COUNT=0
    -DMAX_SHOT_COUNT=9999
    -DMIN_DELAY_MS=0
    -DMAX_DELAY_MS=3600000
