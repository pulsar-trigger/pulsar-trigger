name: Android Build

on:
  push:
    paths:
      - 'android/**'
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building app v$VERSION"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/pulsar-release.jks

      - name: Create keystore.properties
        run: |
          printf '%s\n' \
            "storeFile=../pulsar-release.jks" \
            "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" \
            "keyAlias=${{ secrets.KEY_ALIAS }}" \
            "keyPassword=${{ secrets.KEY_PASSWORD }}" \
            > android/keystore.properties

      - name: Run unit tests
        run: |
          cd android
          chmod +x gradlew
          ./gradlew test

      - name: Run lint (blocks the release on lint errors)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew lintRelease

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/pulsar-app-v${{ steps.version.outputs.version }}.apk

      - name: Build release notes
        id: notes
        run: |
          # The version-bump commit message IS the changelog — pull the
          # message of the last commit that touched the version file so a
          # trailing docs commit in the same push can't hijack the notes.
          {
            echo "notes<<RELEOF"
            git log -1 --pretty=%B -- android/app/build.gradle.kts
            echo ""
            echo "Install via the in-app updater (Settings → App Update) or download the APK below."
            echo "RELEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.version.outputs.version }}
          name: "App v${{ steps.version.outputs.version }}"
          body: ${{ steps.notes.outputs.notes }}
          files: |
            android/app/build/outputs/apk/release/pulsar-app-v${{ steps.version.outputs.version }}.apk
          draft: false
          prerelease: false
          make_latest: true
