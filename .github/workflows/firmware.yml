name: Firmware Build

on:
  push:
    paths:
      - 'firmware/**'
      - 'web/**'
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'   # weekly Monday 04:00 UTC

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Extract firmware version
        id: version
        run: |
          MAJOR=$(grep -oP -m1 'FW_VERSION_MAJOR=\K\d+' firmware/platformio.ini)
          MINOR=$(grep -oP -m1 'FW_VERSION_MINOR=\K\d+' firmware/platformio.ini)
          PATCH=$(grep -oP -m1 'FW_VERSION_PATCH=\K\d+' firmware/platformio.ini)
          VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building firmware $VERSION"

      - name: Run unit tests
        run: cd firmware && pio test -e native

      - name: Build ESP32 firmware
        run: cd firmware && pio run -e esp32

      - name: Build M5StickS3 firmware
        run: cd firmware && pio run -e m5sticks3

      - name: Rename artifacts
        run: |
          cp firmware/.pio/build/esp32/firmware.bin \
             firmware/.pio/build/esp32/pulsar-firmware-${{ steps.version.outputs.version }}-esp32.bin
          cp firmware/.pio/build/m5sticks3/firmware.bin \
             firmware/.pio/build/m5sticks3/pulsar-firmware-${{ steps.version.outputs.version }}-esp32s3.bin

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware-${{ steps.version.outputs.version }}
          name: "Firmware ${{ steps.version.outputs.version }}"
          body: |
            Automated firmware build for Pulsar Trigger.

            **Version:** ${{ steps.version.outputs.version }}
            **Commit:** ${{ github.sha }}

            **Included binaries:**
            - `pulsar-firmware-esp32` — Generic ESP32 (DevKit, Lolin32, etc.)
            - `pulsar-firmware-m5sticks3` — M5StickC Plus2 (ESP32-S3)

            Flash via the [web installer](https://${{ github.repository_owner }}.github.io/pulsar-trigger/), the Android app (Settings → Firmware Update), or manually with PlatformIO.
          files: |
            firmware/.pio/build/esp32/pulsar-firmware-${{ steps.version.outputs.version }}-esp32.bin
            firmware/.pio/build/m5sticks3/pulsar-firmware-${{ steps.version.outputs.version }}-esp32s3.bin
          draft: false
          prerelease: false
          make_latest: true

      - name: Prepare web installer
        run: |
          mkdir -p _site

          cp web/index.html _site/

          # ── ESP32 binaries ──────────────────────────────────────────
          BUILD_ESP32=firmware/.pio/build/esp32
          cp "$BUILD_ESP32/firmware.bin"    _site/firmware-esp32.bin
          cp "$BUILD_ESP32/partitions.bin"  _site/partitions-esp32.bin
          cp "$BUILD_ESP32/bootloader.bin"  _site/bootloader-esp32.bin

          # boot_app0.bin (OTA data init) from Arduino framework
          BOOT_APP0_ESP32=$(find ~/.platformio/packages/framework-arduinoespressif32 \
                            -name boot_app0.bin -print -quit)
          cp "$BOOT_APP0_ESP32" _site/boot_app0-esp32.bin

          # ── M5StickS3 (ESP32-S3) binaries ───────────────────────────
          BUILD_S3=firmware/.pio/build/m5sticks3
          cp "$BUILD_S3/firmware.bin"    _site/firmware-m5sticks3.bin
          cp "$BUILD_S3/partitions.bin"  _site/partitions-m5sticks3.bin
          cp "$BUILD_S3/bootloader.bin"  _site/bootloader-m5sticks3.bin

          BOOT_APP0_S3=$(find ~/.platformio/packages/framework-arduinoespressif32 \
                         -name boot_app0.bin -print -quit)
          cp "$BOOT_APP0_S3" _site/boot_app0-m5sticks3.bin

      - name: Generate manifests
        run: |
          cat > _site/manifest.json << EOF
          {
            "name": "Pulsar Trigger (ESP32)",
            "version": "${{ steps.version.outputs.version }}",
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  { "path": "bootloader-esp32.bin",  "offset": 4096 },
                  { "path": "partitions-esp32.bin",  "offset": 32768 },
                  { "path": "boot_app0-esp32.bin",   "offset": 53248 },
                  { "path": "firmware-esp32.bin",     "offset": 65536 }
                ]
              }
            ]
          }
          EOF

          cat > _site/manifest-m5sticks3.json << EOF
          {
            "name": "Pulsar Trigger (M5StickS3)",
            "version": "${{ steps.version.outputs.version }}",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bootloader-m5sticks3.bin",  "offset": 0 },
                  { "path": "partitions-m5sticks3.bin",  "offset": 32768 },
                  { "path": "boot_app0-m5sticks3.bin",   "offset": 57344 },
                  { "path": "firmware-m5sticks3.bin",     "offset": 65536 }
                ]
              }
            ]
          }
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
