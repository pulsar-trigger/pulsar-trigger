name: Firmware Build

on:
  push:
    paths:
      - 'firmware/**'
      - 'web/**'
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'   # weekly Monday 04:00 UTC

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Extract firmware version
        id: version
        run: |
          MAJOR=$(grep -oP 'FW_VERSION_MAJOR=\K\d+' firmware/platformio.ini)
          MINOR=$(grep -oP 'FW_VERSION_MINOR=\K\d+' firmware/platformio.ini)
          PATCH=$(grep -oP 'FW_VERSION_PATCH=\K\d+' firmware/platformio.ini)
          VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building firmware $VERSION"

      - name: Build firmware
        run: cd firmware && pio run

      - name: Rename artifact
        run: |
          cp firmware/.pio/build/esp32/firmware.bin \
             firmware/.pio/build/esp32/pulsar-firmware-${{ steps.version.outputs.version }}.bin

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware-${{ steps.version.outputs.version }}
          name: "Firmware ${{ steps.version.outputs.version }}"
          body: |
            Automated firmware build for Pulsar Trigger.

            **Version:** ${{ steps.version.outputs.version }}
            **Commit:** ${{ github.sha }}

            Flash via the Android app (Settings → Firmware Update) or manually with PlatformIO.
          files: |
            firmware/.pio/build/esp32/pulsar-firmware-${{ steps.version.outputs.version }}.bin
          draft: false
          prerelease: false
          make_latest: true

      - name: Prepare web installer
        run: |
          mkdir -p _site
          cp web/index.html _site/

          # Collect flash binaries
          BUILD=firmware/.pio/build/esp32
          cp "$BUILD/firmware.bin"    _site/firmware.bin
          cp "$BUILD/partitions.bin"  _site/partitions.bin
          cp "$BUILD/bootloader.bin"  _site/bootloader.bin

          # boot_app0.bin (OTA data init) from Arduino framework
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 \
                      -name boot_app0.bin -print -quit)
          cp "$BOOT_APP0" _site/boot_app0.bin

      - name: Generate manifest.json
        run: |
          cat > _site/manifest.json << EOF
          {
            "name": "Pulsar Trigger",
            "version": "${{ steps.version.outputs.version }}",
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  { "path": "bootloader.bin",  "offset": 4096 },
                  { "path": "partitions.bin",  "offset": 32768 },
                  { "path": "boot_app0.bin",   "offset": 53248 },
                  { "path": "firmware.bin",    "offset": 65536 }
                ]
              }
            ]
          }
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
